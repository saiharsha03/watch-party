services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8090:80" # this PC only; friends come in through the tunnel
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - signal

  signal:
    build: ./signal
    env_file: .env
    ports:
      - "127.0.0.1:8091:8081" # admin channel, this PC only
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://web:80
    depends_on:
      - web
